spring:
  datasource:
    url: jdbc:h2:mem:pulsenotify_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  rabbitmq:
    host: localhost
    port: 5672

  data:
    redis:
      host: localhost
      port: 6379

pulsenotify:
  jwt:
    secret: test-secret-key-at-least-256-bits-long-for-hmac-sha256-signing
    expiration-ms: 3600000

logging:
  level:
    com.pulsenotify: DEBUG